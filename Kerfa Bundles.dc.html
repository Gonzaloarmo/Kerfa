<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ rootRef }}" style="max-width:1280px;margin:0 auto;padding:148px 24px clamp(72px,10vw,120px)">
  <nav aria-label="Breadcrumb" style="font-size:14px;color:#77736C">
    <ol style="list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px">
      <li><a href="#/" style="color:#77736C">Home</a></li>
      <li aria-hidden="true">/</li>
      <li aria-current="page" style="color:#2B2A28">Bundles</li>
    </ol>
  </nav>
  <h1 id="bp-title" style="margin:20px 0 48px;font-family:'Inter Tight',sans-serif;font-weight:500;letter-spacing:-0.02em;font-size:clamp(44px,6vw,88px);line-height:1;max-width:14ch">Build your room, save 15%</h1>
  <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:stretch">
    <div role="radiogroup" aria-labelledby="bp-title" style="flex:1 1 380px;display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{ bundles }}" as="b" hint-placeholder-count="3">
        <div role="radio" data-bundle="{{ b.id }}" aria-checked="{{ b.checked }}" tabIndex="{{ b.tabIndex }}" onClick="{{ b.onClick }}" onKeyDown="{{ b.onKeyDown }}" style="flex:1 1 auto;display:flex;flex-direction:column;gap:16px;padding:22px 24px;border-radius:20px;background:#fff;border:1.5px solid {{ b.border }};cursor:pointer;transition:border-color .25s;box-shadow:0 1px 2px rgba(43,42,40,.06)">
          <div style="display:flex;align-items:center;gap:16px">
            <span aria-hidden="true" style="flex:none;width:22px;height:22px;border-radius:999px;border:1.5px solid #2B2A28;display:grid;place-items:center">
              <span style="width:10px;height:10px;border-radius:999px;background:#2B2A28;transform:scale({{ b.dot }});transition:transform .3s cubic-bezier(.22,1.2,.36,1)"></span>
            </span>
            <span style="flex:1;min-width:0">
              <span style="display:block;font-family:'Inter Tight',sans-serif;font-weight:500;font-size:20px;letter-spacing:-0.01em">{{ b.name }}</span>
              <span style="display:block;color:#77736C;font-size:14px">{{ b.saveText }}</span>
            </span>
            <span style="text-align:right;white-space:nowrap">
              <s style="display:block;color:#77736C;font-size:13px">{{ b.oldText }}</s>
              <span style="font-weight:500;font-size:18px">{{ b.priceText }}</span>
            </span>
          </div>
          <ul style="list-style:none;margin:0;padding:0 0 0 38px;display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{ b.thumbs }}" as="t" hint-placeholder-count="2">
              <li style="display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:#F3EFE8;font-size:13px">
                <img src="{{ t.src }}" alt="" width="32" height="32" loading="lazy" style="width:32px;height:32px;border-radius:999px;object-fit:cover;background:#fff">{{ t.name }}
              </li>
            </sc-for>
          </ul>
        </div>
      </sc-for>
    </div>
    <div data-room="" data-fly="" style="flex:1.5 1 480px;min-width:0;display:flex;flex-direction:column;border-radius:24px;background:#EDE7DD;padding:28px;gap:24px">
      <div role="region" aria-roledescription="carousel" aria-label="Products in this bundle" style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <span style="font-size:14px;color:#77736C">{{ roomCaption }}</span>
          <div style="display:flex;gap:8px">
            <button onClick="{{ roomPrev }}" aria-label="Previous product" style="width:44px;height:44px;border-radius:999px;border:1px solid #CFC6B8;background:#fff;color:#2B2A28;display:grid;place-items:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="M15 6l-6 6 6 6"></path></svg></button>
            <button onClick="{{ roomNext }}" aria-label="Next product" style="width:44px;height:44px;border-radius:999px;border:1px solid #CFC6B8;background:#fff;color:#2B2A28;display:grid;place-items:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="M9 6l6 6-6 6"></path></svg></button>
          </div>
        </div>
        <div style="overflow:hidden;border-radius:16px">
          <div style="display:flex;transform:translateX({{ roomShift }});transition:transform .5s cubic-bezier(.22,1,.36,1)">
            <sc-for list="{{ roomItems }}" as="r" hint-placeholder-count="1">
              <figure data-room-item="" aria-hidden="{{ r.hidden }}" style="margin:0;flex:0 0 100%;min-width:0;background:#fff;border-radius:16px;overflow:hidden">
                <img src="{{ r.img }}" alt="{{ r.name }}" width="1122" height="1402" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover">
                <figcaption style="display:flex;justify-content:space-between;gap:8px;padding:12px 14px;font-size:14px">
                  <a href="{{ r.href }}" style="font-weight:500;text-decoration:underline;text-underline-offset:3px">{{ r.name }}</a>
                  <span style="color:#77736C">{{ r.price }}</span>
                </figcaption>
              </figure>
            </sc-for>
          </div>
        </div>
        <div style="display:flex;justify-content:center;gap:8px">
          <sc-for list="{{ roomDots }}" as="d" hint-placeholder-count="2">
            <button onClick="{{ d.onClick }}" aria-label="{{ d.label }}" aria-current="{{ d.current }}" style="width:{{ d.w }};height:8px;padding:0;border:0;border-radius:999px;background:{{ d.bg }};cursor:pointer;transition:width .3s,background .3s"></button>
          </sc-for>
        </div>
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px">
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;align-items:baseline;gap:10px">
            <span style="font-family:'Inter Tight',sans-serif;font-weight:500;font-size:40px;letter-spacing:-0.02em;line-height:1">{{ totalText }}</span>
            <s style="color:#77736C">{{ oldTotalText }}</s>
          </div>
          <span data-savepill="" style="align-self:flex-start;padding:5px 12px;border-radius:999px;background:#E3CFA8;font-size:13px;font-weight:500">{{ saveText }}</span>
        </div>
        <button onClick="{{ addBundle }}" style="height:52px;padding:0 28px;border-radius:999px;border:0;background:#2B2A28;color:#fff;font-size:16px;font-weight:500;cursor:pointer;transition:transform .35s cubic-bezier(.22,1.2,.36,1)" style-hover="transform:translateY(-2px) scale(1.02)">Add bundle to cart</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;k&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  state = { bundle: 'home-office', shownTotal: 476, roomIdx: 0 };
  rootRef = React.createRef();
  componentDidMount() { this.dropRoom(); }
  dropRoom() {
    const k = this.props.k; if (!k || k.reduced || !this.rootRef.current) return;
    this.rootRef.current.querySelectorAll('[data-room-item]').forEach((el, i) => el.animate([{ transform: 'translateY(-40px)', opacity: 0 }, { transform: 'translateY(4px)', opacity: 1, offset: 0.7 }, { transform: 'none', opacity: 1 }], { duration: 520, delay: i * 120, easing: 'ease-out', fill: 'backwards' }));
  }
  select(id, focus) {
    const k = this.props.k, root = this.rootRef.current;
    if (focus) root.querySelector(`[data-bundle="${id}"]`)?.focus();
    if (id === this.state.bundle) return;
    const from = this.state.shownTotal, to = k.B.find(b => b.id === id).price;
    this.setState({ bundle: id, roomIdx: 0 }, () => {
      this.dropRoom();
      if (k.reduced) return this.setState({ shownTotal: to });
      const t0 = performance.now();
      const step = now => { const p = Math.min(1, (now - t0) / 600), e = 1 - Math.pow(1 - p, 3); this.setState({ shownTotal: Math.round(from + (to - from) * e) }); if (p < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
      root.querySelector('[data-savepill]')?.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 500, easing: 'cubic-bezier(.22,1.2,.36,1)' });
    });
  }
  renderVals() {
    const k = this.props.k; if (!k) return { rootRef: this.rootRef };
    const s = this.state, B = k.B, sel = B.find(b => b.id === s.bundle), n = sel.items.length, ri = s.roomIdx % n;
    const bundles = B.map((b, i) => ({
      id: b.id, name: b.name, oldText: k.money(b.old), priceText: k.money(b.price), saveText: `Save ${k.money(b.old - b.price)}`,
      thumbs: b.items.map(id => ({ src: `./assets/${id}-card.png`, name: k.byId(id).name })),
      checked: b.id === s.bundle ? 'true' : 'false', tabIndex: b.id === s.bundle ? 0 : -1, border: b.id === s.bundle ? '#2B2A28' : '#DDD6CB', dot: b.id === s.bundle ? 1 : 0,
      onClick: () => this.select(b.id),
      onKeyDown: e => {
        let j = null;
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') j = (i + 1) % B.length;
        if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') j = (i - 1 + B.length) % B.length;
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); return this.select(b.id); }
        if (j !== null) { e.preventDefault(); this.select(B[j].id, true); }
      }
    }));
    const go = d => this.setState({ roomIdx: (ri + d + n) % n });
    return {
      rootRef: this.rootRef, bundles,
      roomCaption: `In this bundle · ${ri + 1} of ${n}`, roomShift: `-${ri * 100}%`, roomPrev: () => go(-1), roomNext: () => go(1),
      roomItems: sel.items.map((id, i) => { const p = k.byId(id); return { img: `./assets/${id}-card.png`, name: p.name, price: k.money(p.price), href: '#/product/' + id, hidden: i === ri ? undefined : 'true' }; }),
      roomDots: sel.items.map((_, i) => ({ onClick: () => this.setState({ roomIdx: i }), label: `Show product ${i + 1}`, current: i === ri ? 'true' : undefined, w: i === ri ? '24px' : '8px', bg: i === ri ? '#2B2A28' : '#CFC6B8' })),
      totalText: k.money(s.shownTotal), oldTotalText: k.money(sel.old), saveText: `You save ${k.money(sel.old - sel.price)}`,
      addBundle: e => k.addBundle(sel.id, e.currentTarget)
    };
  }
}
</script>
</body>
</html>
