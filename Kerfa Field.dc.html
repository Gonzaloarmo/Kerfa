<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:6px;min-width:0">
  <label for="{{ id }}" style="font-size:14px;font-weight:500;color:#2B2A28">{{ label }}</label>
  <div style="position:relative">
    <sc-if value="{{ isInput }}" hint-placeholder-val="{{ true }}">
      <input id="{{ id }}" name="{{ name }}" type="{{ type }}" autoComplete="{{ ac }}" inputMode="{{ im }}" placeholder="{{ ph }}" maxLength="{{ max }}" value="{{ value }}" onChange="{{ onChange }}" onBlur="{{ onBlur }}" aria-invalid="{{ invalid }}" aria-describedby="{{ describedBy }}" aria-required="{{ required }}" style="width:100%;height:52px;padding:0 {{ padR }} 0 16px;border-radius:12px;border:1.5px solid {{ border }};background:#fff;font-family:inherit;font-size:16px;color:#2B2A28">
    </sc-if>
    <sc-if value="{{ isSelect }}" hint-placeholder-val="{{ false }}">
      <select id="{{ id }}" name="{{ name }}" autoComplete="{{ ac }}" value="{{ value }}" onChange="{{ onChange }}" onBlur="{{ onBlur }}" aria-invalid="{{ invalid }}" aria-describedby="{{ describedBy }}" aria-required="{{ required }}" style="width:100%;height:52px;padding:0 40px 0 16px;border-radius:12px;border:1.5px solid {{ border }};background:#fff;font-family:inherit;font-size:16px;color:#2B2A28;appearance:none;-webkit-appearance:none;cursor:pointer">
        <option value="">{{ ph }}</option>
        <sc-for list="{{ options }}" as="o" hint-placeholder-count="0">
          <option value="{{ o.v }}">{{ o.l }}</option>
        </sc-for>
      </select>
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="position:absolute;right:16px;top:18px;pointer-events:none;fill:none;stroke:#2B2A28;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="M6 9l6 6 6-6"></path></svg>
    </sc-if>
    <sc-if value="{{ isArea }}" hint-placeholder-val="{{ false }}">
      <textarea id="{{ id }}" name="{{ name }}" rows="6" value="{{ value }}" onChange="{{ onChange }}" onBlur="{{ onBlur }}" aria-invalid="{{ invalid }}" aria-describedby="{{ describedBy }}" aria-required="{{ required }}" style="width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid {{ border }};background:#fff;font-family:inherit;font-size:16px;line-height:1.5;color:#2B2A28;resize:vertical"></textarea>
    </sc-if>
    <sc-if value="{{ hasBrand }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;right:12px;top:14px;height:24px;min-width:44px;padding:0 8px;border-radius:6px;border:1px solid #DDD6CB;background:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;display:grid;place-items:center;color:#2B2A28">{{ brand }}</span>
    </sc-if>
  </div>
  <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}">
    <p id="{{ errId }}" style="margin:0;color:#B3412F;font-size:13px;display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg><span>{{ err }}</span></p>
  </sc-if>
  <sc-if value="{{ hasHint }}" hint-placeholder-val="{{ false }}">
    <p style="margin:0;color:#77736C;font-size:13px">{{ hint }}</p>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:110},&quot;f&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const f = this.props.f || {}, kind = f.kind || 'input', err = f.err || '';
    return {
      id: f.id, name: f.name || f.id, label: f.label, type: f.type || 'text', ac: f.ac, im: f.im, max: f.max,
      ph: f.ph || (kind === 'select' ? 'Select' : ''), value: f.value ?? '', onChange: f.onChange, onBlur: f.onBlur,
      isInput: kind === 'input', isSelect: kind === 'select', isArea: kind === 'area', options: f.options || [],
      hasErr: !!err, err, errId: f.id + '-err', invalid: err ? 'true' : undefined, describedBy: err ? f.id + '-err' : undefined,
      required: f.optional ? undefined : 'true', border: err ? '#B3412F' : '#DDD6CB',
      padR: f.brand ? '72px' : '16px', hasBrand: !!f.brand, brand: f.brand, hasHint: !!f.hint && !err, hint: f.hint
    };
  }
}
</script>
</body>
</html>
